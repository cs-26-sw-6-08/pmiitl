<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PMIITL Monitor</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --border: #d4d8de; --text: #1d2228; --muted: #6a7380;
    --accent: #2f6fde; --accent-hover: #2459b8; --error: #c4302b; --violation: #b35c00; --info: #2d7d46;
    --ok: #5cb870;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15181c; --panel: #1e2227; --border: #343a42; --text: #e3e6ea; --muted: #8b939e;
      --accent: #4a86f0; --accent-hover: #6b9cf3; --error: #f0605a; --violation: #f0a04a; --info: #5cc27e;
      --ok: #a3e4b2;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, sans-serif;
    display: flex; flex-direction: column; gap: 12px; padding: 16px;
    max-width: 1100px; margin: 0 auto;
  }
  h1 { font-size: 18px; margin: 0; }
  section { display: flex; flex-direction: column; gap: 6px; min-height: 0; }
  #props-section { flex: 1 1 45%; }
  #output-section { flex: 1 1 55%; }
  label, .label { font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; }
  label small, .label small { font-weight: 400; color: var(--muted); }
  textarea, #output {
    flex: 1; width: 100%; min-height: 120px; margin: 0;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 10px;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  textarea { resize: none; tab-size: 4; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #output { overflow: auto; white-space: pre-wrap; word-break: break-word; }
  #output .info { color: var(--info); }
  #output .violation { color: var(--violation); }
  #output .ok { color: var(--ok); }
  #output.hide-ok .ok { display: none; }
  #output .error { color: var(--error); font-weight: 600; }
  .label-right { display: flex; gap: 12px; align-items: baseline; }
  .label .toggle { font-weight: 400; font-size: 13px; display: inline-flex; justify-content: flex-start; gap: 4px; align-items: center; cursor: pointer; }
  #output .empty { color: var(--muted); }
  footer { display: flex; gap: 12px; align-items: center; }
  button {
    flex: 1; padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer;
    color: #fff; background: var(--accent); border: none; border-radius: 6px;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: .6; cursor: wait; }
  #status { color: var(--muted); min-width: 0; }
  #status.bad { color: var(--error); }
</style>
</head>
<body>
  <h1>PMIITL Monitor</h1>

  <section id="props-section">
    <label for="props">Properties <small>Ctrl+Enter to push</small></label>
    <textarea id="props" spellcheck="false" placeholder="always ...;"></textarea>
  </section>

  <section id="output-section">
    <div class="label">Violations &amp; errors
      <span class="label-right">
        <small id="conn"></small>
        <label class="toggle"><input type="checkbox" id="show-ok"> Show timepoints with no violation</label>
      </span>
    </div>
    <div id="output" role="log" aria-live="polite"><span class="empty">No output yet.</span></div>
  </section>

  <footer>
    <button id="push">Push properties &amp; restart monitor</button>
  </footer>
  <div id="status"></div>

<script>
  const props = document.getElementById('props');
  const output = document.getElementById('output');
  const pushBtn = document.getElementById('push');
  const status = document.getElementById('status');
  const conn = document.getElementById('conn');
  const showOk = document.getElementById('show-ok');

  // Display preference is per browser only; the server always sends the lines
  function applyShowOk() {
    output.classList.toggle('hide-ok', !showOk.checked);
    output.scrollTop = output.scrollHeight;
  }
  try { showOk.checked = localStorage.getItem('showOk') === '1'; } catch (e) {}
  showOk.addEventListener('change', () => {
    try { localStorage.setItem('showOk', showOk.checked ? '1' : '0'); } catch (e) {}
    applyShowOk();
  });
  applyShowOk();

  let generation = null;
  let next = 0;

  function setStatus(text, bad) {
    status.textContent = text;
    status.className = bad ? 'bad' : '';
  }

  function appendLines(lines) {
    if (!lines.length) return;
    const atBottom = output.scrollHeight - output.scrollTop - output.clientHeight < 20;
    const empty = output.querySelector('.empty');
    if (empty) empty.remove();
    for (const line of lines) {
      const div = document.createElement('div');
      div.className = line.kind;
      div.textContent = line.text;
      output.appendChild(div);
    }
    if (atBottom) output.scrollTop = output.scrollHeight;
  }

  async function poll() {
    try {
      const q = generation === null ? '' : `?generation=${generation}&since=${next}`;
      const res = await fetch('/api/output' + q);
      const data = await res.json();
      if (data.generation !== generation) {
        output.innerHTML = '<span class="empty">No output yet.</span>';
        generation = data.generation;
      }
      next = data.next;
      appendLines(data.lines);
      conn.textContent = '';
    } catch (e) {
      conn.textContent = 'disconnected from monitor';
    }
    setTimeout(poll, 1000);
  }

  async function push() {
    pushBtn.disabled = true;
    setStatus('Compiling…');
    try {
      const res = await fetch('/api/properties', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ properties: props.value }),
      });
      const data = await res.json();
      if (data.ok) {
        setStatus('Monitor restarted.');
      } else {
        setStatus('Compile failed. The previous monitor is still running.', true);
      }
    } catch (e) {
      setStatus('Could not reach the monitor: ' + e, true);
    } finally {
      pushBtn.disabled = false;
    }
  }

  pushBtn.addEventListener('click', push);
  props.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); push(); }
    if (e.key === 'Tab') {
      e.preventDefault();
      props.setRangeText('    ', props.selectionStart, props.selectionEnd, 'end');
    }
  });

  fetch('/api/properties').then(r => r.json()).then(d => { props.value = d.properties; });
  poll();
</script>
</body>
</html>
